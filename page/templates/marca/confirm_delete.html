{% extends 'panel.html' %}

{% block panel_content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h2 class="mb-3">Eliminar marca</h2>
        <p>Seguro que deseas eliminar la marca <strong>{{ marca.nombre }}</strong>?</p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="{% url 'marca_panel' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
