{% extends 'base.html' %}

{% block content %}
<section class="section section-bg">
  <div class="container" data-aos="fade-up">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <h2 class="mb-3">Ingresar</h2>
            <p class="text-muted mb-4">Inicia sesión para acceder a la configuración.</p>

            {% if form.errors %}
              <div class="alert alert-danger" role="alert">
                Usuario o contraseña incorrectos.
              </div>
            {% endif %}

            <form method="post">
              {% csrf_token %}

              <div class="mb-3">
                <label for="id_username" class="form-label">Usuario</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
              </div>

              <div class="mb-4">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
              </div>

              <button type="submit" class="btn btn-warning w-100">Ingresar</button>
              <input type="hidden" name="next" value="{{ next }}">
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
