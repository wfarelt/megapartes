{% extends 'panel.html' %}

{% block panel_content %}
<section class="reveal-item" aria-label="Formulario de sucursal">
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card ui-neumo shadow-sm border-0 reveal-item">
      <div class="card-body p-4 p-md-5">
        <h2 class="mb-4">{{ title }}</h2>

        <form method="post" enctype="multipart/form-data" aria-label="Formulario de sucursal" novalidate>
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
          {% endif %}

          {% for field in form %}
            <div class="mb-3 reveal-item">
              <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
              {% endif %}
            </div>
          {% endfor %}

          <div class="d-flex flex-wrap gap-2 pt-2" role="group" aria-label="Acciones de formulario">
            <button type="submit" class="btn btn-warning" aria-label="Guardar sucursal">{{ button_label }}</button>
            <a href="{% url 'sucursal_panel' %}" class="btn btn-outline-secondary" aria-label="Cancelar y volver a sucursales">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</section>
{% endblock %}
